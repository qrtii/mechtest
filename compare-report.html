<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مقارنة التقرير | كراج الميكانيكي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=mechanics-sheet-mentions" />
  <style>
    html, body { min-height: 100%; }
    .compare-page-shell {
      width: min(1600px, calc(100% - 34px));
      margin: 0 auto;
      padding: 26px 0;
    }
    @media (max-width: 860px) {
      .compare-page-shell {
        width: min(100% - 20px, 1600px);
        padding: 16px 0 30px;
      }
    }
  </style>
</head>
<body>
  <main class="compare-page-shell">
    <nav class="top-nav card" aria-label="التنقل بين صفحات الموقع">
      <a href="index.html">توجيهات الميدان</a>
      <a href="reports.html">التقارير الميدانية</a>
      <a href="supervision.html">تقارير الاشراف</a>
      <a href="admin.html">شؤون إدارية</a>
      <a class="active" href="compare-report.html">مقارنة التقرير</a>
    
      <div class="nav-session-box">
        <span>Discord ID</span>
        <strong data-discord-id>---</strong>
        <button type="button" data-logout>إنهاء الجلسة</button>
      </div>
    </nav>


    <section class="card mechanics-mention-helper">
      <div class="compare-toolbar">
        <h1>تحويل كود الميكانيك إلى منشن</h1>
        <button id="refreshMechanicsSheetBtn" class="ghost" type="button">تحديث جدول الميكانيك</button>
      </div>
      <p class="section-note">جدول الميكانيك: <span data-mechanics-status>جاري قراءة جدول الميكانيك...</span></p>
      <div class="grid two">
        <div class="field">
          <label for="compareMentionInput">الكود / الاسم / Copy ID</label>
          <textarea id="compareMentionInput" rows="4" placeholder="مثال: G-109 أو سعيد البدواوي أو Copy ID"></textarea>
        </div>
        <div class="field">
          <label for="compareMentionOutput">المنشن الناتج</label>
          <textarea id="compareMentionOutput" rows="4" readonly>اكتب الكود أو الاسم أو Copy ID ثم اضغط تحويل.</textarea>
        </div>
      </div>
      <div class="button-row">
        <button id="convertCompareMentionBtn" class="primary" type="button">تحويل إلى منشن</button>
        <button id="copyCompareMentionBtn" class="secondary" type="button">نسخ المنشن</button>
      </div>
    </section>

    <section class="card compare-full-card">
      <div class="compare-toolbar">
        <h1>مقارنة التقرير</h1>
        <a class="compare-open-link" href="https://xhhp1.github.io/SOMTINGHNEW/" target="_blank" rel="noopener">فتح في صفحة مستقلة</a>
      </div>

      <div class="compare-frame-full">
        <iframe
          src="https://xhhp1.github.io/SOMTINGHNEW/"
          title="مقارنة التقرير"
          loading="eager"
          referrerpolicy="no-referrer-when-downgrade"
          allowfullscreen>
        </iframe>
      </div>
    </section>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="mechanics-data.js?v=mechanics-sheet-mentions"></script>
  <script src="compare-mentions.js?v=mechanics-sheet-mentions"></script>
  <script src="auth.js?v=mechanics-sheet-mentions"></script>
</body>
</html>
