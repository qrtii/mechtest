<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>توجيهات الميدان | كراج الميكانيك</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=field-discord-profiles" />
</head>
<body>
  <main class="page-shell">
    <nav class="top-nav card" aria-label="التنقل بين صفحات الموقع">
      <a class="active" href="index.html">توجيهات الميدان</a>
      <a href="reports.html">التقارير الميدانية</a>
      <a href="supervision.html">تقارير الاشراف</a>
      <a href="admin.html">شؤون إدارية</a>
      <a href="compare-report.html">مقارنة التقرير</a>
    
      <div class="nav-session-box">
        <span>Discord ID</span>
        <strong data-discord-id>---</strong>
        <button type="button" data-logout>إنهاء الجلسة</button>
      </div>
    </nav>

    <section class="hero card">
      <div class="badge">كراج الميكانيك</div>
      <h1>توجيهات الميدان</h1>
      <p>اختر الموقع والاسم والكود، ثم اضغط إظهار الاسم للحصول على النص جاهزاً للنسخ.</p>
    </section>

    <section class="card form-card" aria-label="نموذج المسمى الميداني">
      <div class="field">
        <label for="rank">الموقع / المسمى الميداني</label>
        <select id="rank" required>
          <option value="">اختر المسمى</option>
          <option>اشراف عام</option>
          <option>اشراف ميداني</option>
          <option>اشراف منطقة لوس</option>
          <option>اشراف منطقة ساندي</option>
          <option>اشراف منطقة بوليتو</option>
          <option>لوس</option>
          <option>ساندي</option>
          <option>بوليتو</option>
          <option>الجزيرة</option>
        </select>
      </div>

      <div class="field">
        <label for="company">الاسم</label>
        <select id="company">
          <option value="">اختر الاسم</option>
          <option>سعيد البدواوي</option>
          <option>محمد بن فاضل</option>
          
            <option value="سعيد البدواوي">سعيد البدواوي</option>
            <option value="محمد بن فاضل">محمد بن فاضل</option></select>
          <div id="discordProfileCard" class="discord-profile-card hidden" aria-live="polite">
            <img id="discordProfileAvatar" src="" alt="صورة البروفايل" />
            <div>
              <strong id="discordProfileName">---</strong>
              <span id="discordProfileId">---</span>
            </div>
          </div>
      </div>

      <div class="field">
        <label for="certified">لاعب معتمد <span>(اختياري)</span></label>
        <select id="certified">
          <option value="">بدون</option>
          <option>CD</option>
          <option>CC</option>
          <option>CB</option>
          <option>CA</option>
        
            <option value="CD">CD</option></select>
      </div>

      <div class="field">
        <label for="playerName">الكود <span>(اختياري)</span></label>
        <select id="playerName">
          <option value="">بدون كود</option>
          <option>G-163</option>
          <option>G-073</option>
        
            <option value="G-142">G-142</option>
            <option value="G-070">G-070</option></select>
      </div>

      <div class="button-row">
        <button id="showBtn" class="primary" type="button">اضغط هنا لإظهار اسمك ✒️</button>
        <button id="copyBtn" class="secondary" type="button">اضغط هنا للنسخ</button>
      </div>

      <div id="resultBox" class="result" aria-live="polite">
        سيظهر النص هنا بعد الاختيار.
      </div>
    </section>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="script.js?v=field-discord-profiles"></script>
  <script src="auth.js?v=field-discord-profiles"></script>
</body>
</html>
