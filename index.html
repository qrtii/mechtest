<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>توجيهات الميدان | كراج الميكانيكي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=account-only-direction" />
</head>
<body>
  <nav class="top-nav">
    <a class="active" href="index.html">توجيهات الميدان</a>
    <a href="reports.html">التقارير الميدانية</a>
    <a href="supervision.html">تقارير الإشراف</a>
    <a href="admin.html">شؤون إدارية</a>
    <a href="compare-report.html">مقارنة التقرير</a>
    <div class="nav-session-box">
      <span>Discord ID</span>
      <strong data-discord-id>---</strong>
      <button type="button" data-logout>إنهاء الجلسة</button>
    </div>
  </nav>

  <main class="page-shell wide">
    <section class="hero card">
      <span class="badge">FIVEM RP</span>
      <h1>توجيهات الميدان</h1>
      <p>يتم تحديد اسمك وكودك تلقائياً حسب حساب Discord المسجل دخول. اختر التوجيه فقط ثم انسخ النص.</p>
    </section>

    <section class="form-card card direction-only-card">
      <div class="field account-field">
        <label>الحساب الحالي</label>
        <div id="currentProfileCard" class="discord-profile-card">
          <img id="currentProfileAvatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="صورة البروفايل" />
          <div>
            <strong id="currentProfileName">---</strong>
            <span id="currentProfileDetails">---</span>
          </div>
        </div>
      </div>

      <div class="field direction-field">
        <label for="rank">التوجيه / المسمى الميداني</label>
        <select id="rank">
          <option value="">اختر التوجيه</option>
          <option value="مقاطعة بوليتو">مقاطعة بوليتو</option>
          <option value="لوس">لوس</option>
          <option value="ساندي">ساندي</option>
          <option value="جزيرة بوليتو">جزيرة بوليتو</option>
          <option value="ميناء لوس">ميناء لوس</option>
          <option value="ميناء بوليتو">ميناء بوليتو</option>
        </select>
      </div>

      <input id="company" type="hidden" />
      <input id="certified" type="hidden" />
      <input id="playerName" type="hidden" />

      <div class="button-row">
        <button id="showBtn" class="primary" type="button">إظهار النص</button>
        <button id="copyBtn" class="secondary" type="button">نسخ النص</button>
      </div>

      <div id="resultBox" class="result">سيظهر النص هنا بعد اختيار التوجيه.</div>
    </section>
  </main>

  <div id="toast"></div>

  <script src="auth.js?v=account-only-direction"></script>
  <script src="script.js?v=account-only-direction"></script>
</body>
</html>
